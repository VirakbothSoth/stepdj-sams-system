{% extends 'base.html' %}
{% block content %}

<div class="max-w-lg mx-auto bg-white rounded-xl shadow p-8 mt-6">
    <h2 class="text-xl font-bold text-gray-800 mb-6">Add Subject</h2>
    <form method="POST" class="space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <div class="flex gap-3 pt-2">
            <button type="submit"
                class="bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-800 transition">
                Save
            </button>
            <a href="{% url 'subject_list' %}"
                class="bg-gray-100 text-gray-700 px-5 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition">
                Cancel
            </a>
        </div>
    </form>
</div>

{% endblock %}
