{% extends 'base.html' %}
{% block content %}

<div class="max-w-md mx-auto bg-white rounded-xl shadow p-8 mt-10">
    <h2 class="text-xl font-bold text-gray-800 mb-2">Confirm Delete</h2>
    <p class="text-gray-500 text-sm mb-6">
        Are you sure you want to delete <span class="font-semibold text-red-600">{{ object }}</span>? This cannot be undone.
    </p>
    <form method="POST" class="flex gap-3">
        {% csrf_token %}
        <button type="submit"
            class="bg-red-600 text-white px-5 py-2 rounded-lg text-sm font-semibold hover:bg-red-700 transition">
            Delete
        </button>
        <a href="javascript:history.back()"
            class="bg-gray-100 text-gray-700 px-5 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition">
            Cancel
        </a>
    </form>
</div>

{% endblock %}
