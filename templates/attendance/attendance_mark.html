{% extends 'base.html' %}
{% block content %}

<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Mark Attendance</h1>
    <p class="text-gray-500 text-sm mt-1">{{ attendance.classroom.name }} — {{ attendance.date }}</p>
</div>

<form method="POST">
    {% csrf_token %}
    <div class="bg-white rounded-xl shadow overflow-hidden mb-6">
        <table class="w-full text-sm">
            <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
                <tr>
                    <th class="px-6 py-3 text-left">Student</th>
                    <th class="px-6 py-3 text-left">Status</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100">
                {% for student in students %}
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 font-medium text-gray-800">{{ student.name }}</td>
                    <td class="px-6 py-4">
                        <select
                            name="status_{{ student.id }}"
                            class="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        >
                            {% for value, label in status_choices %}
                                <option value="{{ value }}">{{ label }}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="px-6 py-8 text-center text-gray-400">No students in this classroom.</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <div class="flex gap-3">
        <button type="submit"
            class="bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-800 transition">
            Save Attendance
        </button>
        <a href="{% url 'attendance_detail' attendance.pk %}"
            class="bg-gray-100 text-gray-700 px-5 py-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition">
            Cancel
        </a>
    </div>
</form>

{% endblock %}
