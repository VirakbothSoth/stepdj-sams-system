{% extends 'base.html' %}
{% block content %}

<div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-800">Classrooms</h1>
    <a href="{% url 'classroom_create' %}"
        class="bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-indigo-800 transition">
        + Add Classroom
    </a>
</div>

<div class="bg-white rounded-xl shadow overflow-hidden">
    <table class="w-full text-sm">
        <thead class="bg-gray-100 text-gray-600 uppercase text-xs">
            <tr>
                <th class="px-6 py-3 text-left">Name</th>
                <th class="px-6 py-3 text-left">Code</th>
                <th class="px-6 py-3 text-left">Subject</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
            {% for classroom in classrooms %}
            <tr class="hover:bg-gray-50">
                <td class="px-6 py-4 font-medium text-gray-800">{{ classroom.name }}</td>
                <td class="px-6 py-4 text-gray-500">{{ classroom.class_code }}</td>
                <td class="px-6 py-4 text-gray-500">{{ classroom.subject.name }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" class="px-6 py-8 text-center text-gray-400">No classrooms found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

{% endblock %}
