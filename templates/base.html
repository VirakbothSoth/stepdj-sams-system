<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

    <nav class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="{% url 'dashboard' %}" class="text-xl font-bold tracking-wide">SAMS</a>
            <div class="flex gap-6 text-sm font-medium">
                <a href="{% url 'student_list' %}" class="hover:text-indigo-200 transition">Students</a>
                <a href="{% url 'teacher_list' %}" class="hover:text-indigo-200 transition">Teachers</a>
                <a href="{% url 'classroom_list' %}" class="hover:text-indigo-200 transition">Classes</a>
                <a href="{% url 'subject_list' %}" class="hover:text-indigo-200 transition">Subjects</a>
                <a href="{% url 'attendance_list' %}" class="hover:text-indigo-200 transition">Attendance</a>
                <a href="{% url 'logout' %}" class="hover:text-red-300 transition">Logout</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
